name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      # FIX: Use capacitor.config.json to prevent the CommonJS / TypeScript parsing error
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.spotizip.app",
            "appName": "SpotiZip",
            "webDir": "dist"
          }
          EOF
          npx cap add android || true
          npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotiZip-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
