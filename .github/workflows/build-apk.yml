name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Build Web App
        run: npm run build

      # FIX: Configure Capacitor to connect to the live cloud backend & allow network requests
      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli --legacy-peer-deps
          rm -f capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.spotizip.app",
            "appName": "SpotiZip",
            "webDir": "dist",
            "server": {
              "url": "https://ais-pre-v65lr33j57wu7v2e4yj6ns-949234535905.asia-southeast1.run.app",
              "cleartext": true
            }
          }
          EOF
          npx cap add android || true
          npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      # Fix legacy Kotlin duplicate classes
      - name: Fix Duplicate Kotlin Classes
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      # Ensure Android INTERNET permission is enabled
      - name: Add Android Internet Permissions
        run: |
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml || true

      - name: Build APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SpotiZip-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
